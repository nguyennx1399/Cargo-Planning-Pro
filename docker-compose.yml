services:
  api:
    build: ./backend
    ports: ["8000:8000"]
    volumes: ["./backend/app:/app/app"]
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
  web:
    build: ./frontend
    ports: ["5173:5173"]
    environment:
      API_URL: http://api:8000
    volumes: ["./frontend/src:/app/src"]
    depends_on: [api]
